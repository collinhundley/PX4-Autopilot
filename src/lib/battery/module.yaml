    - group: Battery SOC Estimation
      definitions:

        BAT_SOC_TC:
            description:
                short: SOC voltage correction time constant
                long: |
                    Elapsed-time voltage correction applied after qualification. Larger values give coulomb counting more weight.
            type: float
            unit: s
            min: 1
            max: 3600
            decimal: 0
            default: 300

        BAT_SOC_I_MAX:
            description:
                short: Maximum current for disarmed relaxation
                long: |
                    Disarmed relaxation and voltage correction require measured discharge current
                    at or below this limit. This does not restrict startup, coulomb counting or flight corrections.
                    Idle current overwrite cannot qualify relaxation.
            type: float
            unit: A
            min: 0.01
            max: 100
            decimal: 2
            default: 2

        BAT_SOC_I_STAB:
            description:
                short: Disarmed current stability range
                long: |
                    Maximum current span over the entire disarmed qualification interval. A larger span restarts settling, including during gradual load changes.
            type: float
            unit: A
            min: 0.01
            max: 100
            decimal: 2
            default: 0.5

        BAT_SOC_SETTLE:
            description:
                short: Disarmed voltage settling time
                long: |
                    Continuous low and stable current while disarmed required to qualify relaxed voltage
                    and allow corrections. This is not a startup delay; a voltage-based estimate is available after
                    normal battery startup. Load changes, stale vehicle status or sample gaps restart settling.
            type: float
            unit: s
            min: 1
            max: 3600
            decimal: 0
            default: 120

        BAT_SOC_F_SETT:
            description:
                short: Flight voltage correction qualification time
                long: |
                    Continuous semi-stable electrical power required while armed before gradual
                    voltage corrections start. Power span must remain within BAT_SOC_P_STAB.
                    Load changes, stale vehicle status, missing measurements or sample gaps restart
                    qualification. Does not delay startup or pause coulomb counting.
            type: float
            unit: s
            min: 1
            max: 120
            decimal: 1
            default: 10

        BAT_SOC_P_STAB:
            description:
                short: Flight electrical power stability range
                long: |
                    Maximum peak-to-peak power span as a percentage of the midpoint between minimum
                    and maximum power over the entire qualification interval. For example, 30 percent
                    permits 170 to 230 W. Power is measured terminal pack voltage times current.
                    Exceeding the span restarts flight qualification, including gradual load changes.
                    No absolute current limit applies to flight corrections.
            type: float
            unit: '%'
            min: 1
            max: 100
            decimal: 0
            default: 30

        BAT_SOC_F_DV:
            description:
                short: Flight voltage uncertainty margin per cell
                long: |
                    Uncertainty on either side of compensated cell voltage during qualified flight.
                    The lookup table maps this voltage interval to an SOC interval. Corrections act
                    toward its nearest edge only when coulomb-updated SOC lies outside the interval.
                    Suppresses corrections from small load-compensation errors in either direction.
            type: float
            unit: V
            min: 0
            max: 0.2
            decimal: 3
            default: 0.02

        BAT_SOC_F_RATE:
            description:
                short: Maximum flight voltage correction rate
                long: |
                    Maximum change due to voltage correction in SOC percentage points per minute,
                    in either direction. BAT_SOC_TC also limits the correction. For example, 2 means
                    at most two percentage points per minute of qualified flight. This never limits
                    SOC depletion from measured current and does not modify measured discharge.
            type: float
            min: 0.1
            max: 20
            decimal: 1
            default: 2

        BAT_V_TC:
            description:
                short: Terminal voltage filter time constant
                long: |
                    Elapsed-time low-pass filter for independent voltage protection. Uses actual terminal voltage without resistance compensation.
            type: float
            unit: s
            min: 0.01
            max: 10
            decimal: 2
            default: 1

        BAT_V_DELAY:
            description:
                short: Terminal voltage warning debounce
                long: |
                    Continuous threshold violation needed after filtering to change voltage warning severity. Also debounces recovery.
            type: float
            unit: s
            min: 0.1
            max: 30
            decimal: 1
            default: 2

        BAT_V_HYST:
            description:
                short: Terminal voltage warning hysteresis
                long: |
                    Cell voltage must recover above the active threshold by this amount before a voltage warning can clear.
            type: float
            unit: V
            min: 0.001
            max: 0.5
            decimal: 3
            default: 0.05

        BAT_SOC_INFLT:
            description:
                short: Allow qualified voltage correction while armed
                long: |
                    Allows slow, bounded corrections after semi-stable electrical power qualifies
                    for BAT_SOC_F_SETT seconds. Uses BAT_SOC_P_STAB, BAT_SOC_F_DV and BAT_SOC_F_RATE
                    instead of the disarmed low-current and relaxation gates.
                    Unknown or stale vehicle state prevents relaxation qualification and voltage
                    correction, but does not prevent startup or coulomb counting.
            type: boolean
            default: true
