module_name: MSP OSD
serial_config:
    - command: msp_osd start -d ${SERIAL_DEV}
      port_config_param:
        name: MSP_OSD_CONFIG
        group: OSD

parameters:
    - group: OSD
      definitions:

        # OSD Parameters
        OSD_SYMBOLS:
            description:
                short: OSD Symbol Selection
                long: |
                  Select DisplayPort items. Existing bit numbers are retained.
                  Set zero to clear and release the overlay. Battery and arming
                  telemetry continue independently. New items use bits 22-30.
                  The default hides pitch, roll, vertical speed and coordinates.
                  The default shows compensated voltages and remaining charge
                  (bits 27-29); measured voltages remain independently selectable.
                  Bit 30 shows the active fixed-wing airspeed target in Mission,
                  Position and Altitude modes, and is disabled by default.
            type: bitmask
            bit:
                0: (unused) PX4_LABEL
                1: ARMING_STATE
                2: GPS_LAT
                3: GPS_LON
                4: GPS_SATS
                5: GPS_SPEED
                6: HOME_DIST
                7: HOME_DIR
                8: MAIN_BATT_VOLTAGE
                9: CURRENT_DRAW
                10: MAH_DRAWN
                11: RSSI_VALUE
                12: ALTITUDE
                13: NUMERICAL_VARIO
                14: FLYMODE
                15: (unused) ESC_TMP
                16: PITCH_ANGLE
                17: ROLL_ANGLE
                18: CROSSHAIRS
                19: AVG_CELL_VOLTAGE
                20: HORIZON_SIDEBARS
                21: POWER
                22: FLIGHT_TIME
                23: AIRSPEED
                24: ARTIFICIAL_HORIZON
                25: MESSAGES
                26: THROTTLE
                27: BATT_COMP_VOLTAGE
                28: BATT_CELL_COMP_VOLTAGE
                29: BATT_PERC
                30: AIRSPEED_SP
            default: 1070882546

        OSD_FONT:
            description:
                short: OSD glyph mapping
                long: |
                  Select the font map supported by the display. INAV matches DJI
                  Goggles N3 and enables the Ah glyph and extended horizon/arrows.
                  Betaflight retains compatibility with page-zero displays.
                  This also selects the matching MSP compatibility identifier.
            type: enum
            values:
                0: Betaflight
                1: INAV (DJI Goggles N3)
            default: 0

        OSD_UNITS:
            description:
                short: OSD display units
                long: Metric uses meters and meters per second; imperial uses feet and miles per hour.
            type: enum
            values:
                0: Metric
                1: Imperial
            default: 1

        OSD_CANVAS:
            description:
                short: OSD canvas size
                long: Auto accepts the air unit's MSP canvas size, falling back to 53 by 20 for DJI O4 and Goggles N3. Select 53 by 20 explicitly to ignore announcements. Item coordinates are fixed; adjust OSD_POS_ parameters to fit a different canvas.
            type: enum
            values:
                0: Auto
                1: 30 by 16
                2: 50 by 18
                3: 60 by 22
                4: 53 by 20 (DJI O4 / Goggles N3)
            default: 0

        OSD_CAM_PITCH:
            description:
                short: OSD camera mounting pitch
                long: Fixed camera uptilt relative to body X. Positive points upward. Used for horizon and home arrow without a flight-mode-dependent frame change.
            type: float
            unit: deg
            min: -90
            max: 90
            default: 0.0

        OSD_CAM_VFOV:
            description:
                short: OSD camera vertical field of view
                long: Effective vertical video field of view used to project the artificial horizon. Adjust for the selected camera mode and crop.
            type: float
            unit: deg
            min: 20
            max: 150
            default: 60.0

        OSD_MSG_TIME:
            description:
                short: OSD message duration
                long: Maximum age of a user-facing message. Queued messages expire from publication time.
            type: int32
            unit: s
            min: 1
            max: 60
            default: 10

        # OSD Log Level
        OSD_LOG_LEVEL:
            description:
                short: OSD Warning Level
                long: |
                  Highest numeric severity accepted from user-facing MAVLink log messages.
                  INFO includes autotune progress. NONE disables messages.
            type: int32
            values:
                0: EMERGENCY
                1: ALERT
                2: CRITICAL
                3: ERROR
                4: WARNING
                5: NOTICE
                6: INFO
                7: DEBUG
                8: NONE
            default: 6

        # Scroll Speed
        OSD_SCROLL_RATE:
            description:
                short: OSD Scroll Rate (ms)
                long: |
                    Scroll rate in milliseconds for OSD messages longer than available character width.
                    This is lower-bounded by the nominal loop rate of this module.
            type: int32
            min: 100
            max: 1000
            default: 125

        # Dwell TIme
        OSD_DWELL_TIME:
            description:
                short: OSD Dwell Time (ms)
                long: |
                    Amount of time in milliseconds to dwell at the beginning of the display, when scrolling.
            type: int32
            min: 100
            max: 10000
            default: 500

        # RC Stick input
        OSD_RC_STICK:
            description:
                short: OSD RC Stick commands
                long: |
                    Forward RC stick input to VTX when disarmed
            type: int32
            min: 0
            max: 1
            default: 0

    - group: OSD Layout
      definitions:
        OSD_POS_ARM_X:
            description:
                short: Arming state X position
                long: |
                    Zero-based column of the first character or icon, from the top left.
                    Changes apply while running. Reset restores the default 53 by 20 layout coordinate.
                    Enable the item with OSD_SYMBOLS. Content outside the active canvas is clipped.
            type: int32
            default: 18
            min: 0
            max: 59

        OSD_POS_ARM_Y:
